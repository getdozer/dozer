# Allow all connections (including logical replication) from any host.
# Used together with `postgres -c hba_file=/etc/dozer/pg_hba.conf` so the
# Dozer container can open a replication slot against Postgres.
local   all all trust
host    all all 0.0.0.0/0 trust
host    all all ::0/0 trust
host    replication all 0.0.0.0/0 trust
host    replication all ::0/0 trust
